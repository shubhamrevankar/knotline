version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    groups:
      production-dependencies:
        dependency-type: production
        update-types: [minor, patch]
      development-tooling:
        dependency-type: development
        update-types: [minor, patch]
      major-updates:
        patterns: ["*"]
        update-types: [major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /apps/api
    schedule:
      interval: monthly
    groups:
      api-base-images:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /apps/web
    schedule:
      interval: monthly
    groups:
      web-base-images:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /infra
    schedule:
      interval: monthly
    groups:
      local-services:
        patterns: ["*"]
