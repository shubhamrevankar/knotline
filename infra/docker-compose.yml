name: knotline-local

# This stack is for local development only. Every credential below is synthetic,
# deliberately named local-only, and must never be promoted to another environment.
services:
  postgres:
    image: pgvector/pgvector:0.8.1-pg17-trixie@sha256:137f044b0efe3d57f39b972b9b53641b1f2045b99d879e298bbf514a25787dcf
    environment:
      POSTGRES_DB: knotline
      POSTGRES_USER: knotline_local
      POSTGRES_PASSWORD: local-only-postgres-password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - knotline-postgres:/var/lib/postgresql/data
      - ../tooling/containers/postgres-init.sql:/docker-entrypoint-initdb.d/10-knotline-local.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knotline_local -d knotline"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  redis:
    image: redis:8.2.1-alpine@sha256:987c376c727652f99625c7d205a1cba3cb2c53b92b0b62aade2bd48ee1593232
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - knotline-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: knotline-local
      MINIO_ROOT_PASSWORD: local-only-minio-password
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - knotline-minio:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.27.8@sha256:6abc8e633df15eaf785cfcf38bae48e66f64beecdc03121e249d0f9ec15f0707
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: "500"
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    volumes:
      - knotline-mailpit:/data
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  temporal:
    image: temporalio/auto-setup:1.28.1@sha256:607d68caa111338d754771efb876c92dfcdae06d056e4530bb31cd0f37406e6a
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_SEEDS: postgres
      POSTGRES_USER: knotline_local
      POSTGRES_PWD: local-only-postgres-password
      BIND_ON_IP: 0.0.0.0
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
    volumes:
      - ../tooling/containers/temporal-dynamicconfig.yml:/etc/temporal/config/dynamicconfig/development-sql.yaml:ro
    ports:
      - "127.0.0.1:7233:7233"
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "127.0.0.1:7233"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  temporal-ui:
    image: temporalio/ui:2.42.1@sha256:64e8d7d3cb24072373034186cd2be41338b75c02cdaba8fec68de9d76ed3b60a
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:5173
    ports:
      - "127.0.0.1:8233:8080"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  model-gateway:
    build:
      context: ..
      dockerfile: apps/model-gateway/Dockerfile
    environment:
      MODEL_GATEWAY_PROVIDER: recorded
      MODEL_GATEWAY_HOST: 0.0.0.0
      MODEL_GATEWAY_PORT: "4200"
      MODEL_GATEWAY_RESIDENCY: local
      MODEL_GATEWAY_SAFETY_SALT: local-only-model-safety-salt
      MODEL_GATEWAY_INTERNAL_TOKEN: local-only-model-gateway-token
    ports:
      - "127.0.0.1:4200:4200"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4200/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      temporal:
        condition: service_healthy
      model-gateway:
        condition: service_healthy
    environment:
      KNOTLINE_ENV: local
      KNOTLINE_API_PORT: "4100"
      KNOTLINE_API_ORIGIN: http://localhost:4100
      KNOTLINE_WEB_ORIGIN: http://localhost:5173
      DATABASE_URL: postgresql://knotline_runtime:local-only-runtime-password@postgres:5432/knotline
      DB_MIGRATION_URL: postgresql://knotline_local:local-only-postgres-password@postgres:5432/knotline
      REDIS_URL: redis://redis:6379
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: default
      S3_ENDPOINT: http://minio:9000
      S3_REGION: local
      S3_ACCESS_KEY_REFERENCE: local-only:knotline-local
      S3_SECRET_KEY_REFERENCE: local-only:local-only-minio-password
      LOG_LEVEL: info
      MODEL_GATEWAY_URL: http://model-gateway:4200
      MODEL_GATEWAY_INTERNAL_TOKEN: local-only-model-gateway-token
    ports:
      - "127.0.0.1:4100:4100"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4100/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: apps/worker/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://knotline_runtime:local-only-runtime-password@postgres:5432/knotline
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: default
      TEMPORAL_TASK_QUEUE: knotline-system-v1
      WORKER_IDENTITY: knotline-local-worker-v1
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: http://localhost:4100
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:5173:8080"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/ready"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

volumes:
  knotline-postgres:
  knotline-redis:
  knotline-minio:
  knotline-mailpit:
