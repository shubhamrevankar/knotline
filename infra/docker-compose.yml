services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: knotline
      POSTGRES_USER: knotline
      POSTGRES_PASSWORD: knotline
    ports:
      - "5432:5432"
    volumes:
      - knotline-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knotline"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - knotline-redis:/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: knotline
      MINIO_ROOT_PASSWORD: change-me-now
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - knotline-minio:/data

volumes:
  knotline-postgres:
  knotline-redis:
  knotline-minio:
