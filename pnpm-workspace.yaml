packages:
  - apps/*
  - packages/*
injectWorkspacePackages: true
syncInjectedDepsAfterScripts:
  - build
catalog:
  "@types/node": 26.1.2
  typescript: 7.0.2
  vitest: 4.1.10
allowBuilds:
  "@swc/core": true
  esbuild: true
  protobufjs: true
  unrs-resolver: false
minimumReleaseAgeExclude:
  - fastify@5.11.0
overrides:
  fast-xml-parser: 5.5.6
